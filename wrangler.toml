name = "mapcsv"
main = "src/worker.ts"
compatibility_date = "2026-10-02"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "mapcsv_analytics"
database_id = "1169c109-b613-46e7-a429-78aceb1bac45"

[vars]
# Set this only for local development with `wrangler dev`.
# Do not enable it in production.
ADMIN_DEV_BYPASS = "false"
